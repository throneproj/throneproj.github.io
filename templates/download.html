<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to <a  id="orginialink" href="https://github.com/throneproj/Throne/releases/tag/{{ env("VERSION") }}">Throne {{ env("VERSION") }}</a>...</p>
  <script>
    function getUrlParameter(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    const tag = getUrlParameter('tag');
    let orginialink = 'https://github.com/throneproj/Throne/releases/tag/{{ env("VERSION") }}';
    const linkElement = document.getElementById('orginialink');
    if (tag) {
      orginialink = 'https://github.com/throneproj/Throne/releases/download/{{ env("VERSION") }}/Throne-{{ env("VERSION") }}-' + `${tag}`;
    }
    linkElement.href = orginialink;
    linkElement.textContent = orginialink;
    window.location.href = orginialink;
  </script>
</body>
</html>
