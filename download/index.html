<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to <a id="orginialink" href="https://github.com/throneproj/Throne/releases/tag/1.3.1">Throne 1.3.1</a>...</p>
  <script>
    // ?tag=<asset suffix> names a desktop asset; add &app=android for a Throne for Android asset.
    // Desktop tags are bare versions (1.3.1), Android tags carry a "v" (v2.0.0); both name assets Throne-<version>-<suffix>.
    const params = new URLSearchParams(window.location.search);
    const android = params.get('app') === 'android';
    const tag = params.get('tag');
    const repo = android ? 'ThroneForAndroid' : 'Throne';
    const version = android ? '2.0.0' : '1.3.1';
    const release = android ? 'v' + version : version;
    let orginialink = 'https://github.com/throneproj/' + repo + '/releases/latest';
    if (version) {
      orginialink = 'https://github.com/throneproj/' + repo + '/releases/tag/' + release;
      if (tag && /^[A-Za-z0-9._-]+$/.test(tag)) {
        orginialink = 'https://github.com/throneproj/' + repo + '/releases/download/' + release + '/Throne-' + version + '-' + tag;
      }
    }
    const linkElement = document.getElementById('orginialink');
    linkElement.href = orginialink;
    linkElement.textContent = orginialink;
    window.location.href = orginialink;
  </script>
</body>
</html>
