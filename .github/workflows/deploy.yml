---
name: Hwaro CI/CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Throne version"
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and Deploy
        uses: parhelia512/hwaro@mod
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
