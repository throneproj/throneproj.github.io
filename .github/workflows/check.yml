---
name: Check docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check docs
        run: |
          pip install --quiet pyyaml
          python scripts/check_docs.py

      - name: Build
        uses: parhelia512/hwaro@mod
        with:
          build_only: "true"
