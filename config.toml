# =============================================================================
# Hwaro Configuration
# =============================================================================

title = "Throne"
description = "Powerful, open-source, cross-platform desktop GUI proxy utility."
base_url = "https://throneproj.github.io"

# =============================================================================
# Multilingual
# =============================================================================
# Every page must exist in both languages. scripts/check_doc_parity.sh enforces
# it in CI, because the language switcher would otherwise point at a 404.

default_language = "en"

[languages.en]
language_name = "English"
weight = 1

[languages.fa]
language_name = "فارسی"
weight = 2

[languages.ru]
language_name = "Русский"
weight = 3

[languages.zh]
language_name = "简体中文"
weight = 4

# =============================================================================
# Plugins
# =============================================================================

[plugins]
processors = ["markdown"]

# =============================================================================
# Content Files
# =============================================================================

[content.files]
allow_extensions = ["jpg", "jpeg", "png", "gif", "svg", "webp"]

# =============================================================================
# Syntax Highlighting
# =============================================================================
# use_cdn = false keeps highlight.js self-hosted (static/assets/js/highlight.min.js),
# which removes the only CDN dependency for code. The theme is irrelevant:
# style.css overrides every .hljs-* token with the monochrome palette.

[highlight]
enabled = true
mode = "client"
use_cdn = false
theme = "atom-one-dark"

# =============================================================================
# Search
# =============================================================================

[search]
enabled = true
format = "fuse_json"
fields = ["title", "content"]
filename = "search.json"
exclude = []

# =============================================================================
# Pagination
# =============================================================================

[pagination]
enabled = false
per_page = 10

# =============================================================================
# SEO
# =============================================================================

[sitemap]
enabled = true
filename = "sitemap.xml"
exclude = []

[robots]
enabled = true
filename = "robots.txt"
rules = [
  { user_agent = "*", disallow = [] }
]

[llms]
enabled = true
filename = "llms.txt"
instructions = "Throne documentation."
full_enabled = true
full_filename = "llms-full.txt"

# =============================================================================
# Markdown
# =============================================================================

[markdown]
safe = false
lazy_loading = true
emoji = false
task_lists = true
definition_lists = true
footnotes = true

# =============================================================================
# Asset Pipeline
# =============================================================================

[assets]
enabled = true
minify = true
fingerprint = true
